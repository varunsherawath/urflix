<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ec">
  <title>Sushmitha &amp; Niranjan | Wedding Invitation</title>
  <meta name="description" content="Join Sushmitha K and Niranjan S for their wedding celebration.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap');

    :root {
      color-scheme: light;
      --paper: #f7f4ec;
      --ink: #26372e;
      --muted: #706f63;
      --line: #d5cbbb;
      --accent: #a85843;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    .welcome {
      position: relative;
      width: min(100%, 1120px);
      min-height: min(740px, calc(100vh - 56px));
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fbfaf6;
    }
    .welcome::before,
    .welcome::after {
      position: absolute;
      z-index: 1;
      content: "";
      pointer-events: none;
    }
    .welcome::before { inset: 10px; border: 1px solid rgba(168, 88, 67, .28); }
    .welcome::after {
      inset: 6px;
      background:
        linear-gradient(var(--accent), var(--accent)) left top / 24px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left top / 1px 24px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 24px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right top / 1px 24px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 24px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) left bottom / 1px 24px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 24px 1px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right bottom / 1px 24px no-repeat;
      opacity: .8;
    }
    .sparkles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .sparkle {
      position: absolute;
      width: var(--size);
      aspect-ratio: 1;
      color: #c99a42;
      opacity: 0;
      animation: twinkle 3.2s ease-in-out var(--delay) infinite;
    }
    .sparkle::before,
    .sparkle::after {
      position: absolute;
      top: 50%;
      left: 50%;
      content: "";
      transform: translate(-50%, -50%);
      border-radius: 2px;
    }
    .sparkle::before {
      width: 2px;
      height: 100%;
      background: linear-gradient(transparent, currentColor 40%, currentColor 60%, transparent);
    }
    .sparkle::after {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, currentColor 40%, currentColor 60%, transparent);
    }
    .sparkle-one { top: 14%; left: 12%; --size: 18px; --delay: -.4s; }
    .sparkle-two { top: 22%; right: 11%; --size: 12px; --delay: -1.8s; }
    .sparkle-three { top: 57%; left: 8%; --size: 14px; --delay: -2.6s; }
    .sparkle-four { top: 64%; right: 8%; --size: 20px; --delay: -1s; }
    .sparkle-five { bottom: 14%; left: 20%; --size: 11px; --delay: -2.2s; }
    .sparkle-six { right: 18%; bottom: 12%; --size: 15px; --delay: -.8s; }
    @keyframes twinkle {
      0%, 100% { opacity: .2; transform: scale(.65) rotate(0deg); }
      50% { opacity: .85; transform: scale(1) rotate(45deg); }
    }
    .welcome-title {
      position: relative;
      z-index: 2;
      margin: 0;
      padding: 28px 20px 0;
      text-align: center;
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(32px, 4vw, 46px);
      font-weight: 500;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .art {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 40px 34px 0;
      display: grid;
      place-items: center;
    }
    .art img { display: block; width: min(100%, 430px); max-height: 470px; object-fit: contain; }
    .copy {
      position: relative;
      z-index: 2;
      padding: 16px 24px 40px;
      text-align: center;
    }
    .enter {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 24px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fffdf8;
      font: 500 10px Montserrat, sans-serif;
      letter-spacing: .16em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color .2s ease, color .2s ease;
    }
    .enter:hover, .enter:focus-visible { background: transparent; color: var(--ink); }
    .enter span { font-size: 17px; line-height: 1; }
    .enter:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .welcome {
        min-height: calc(100svh - 24px);
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .welcome::before { inset: 7px; }
      .welcome::after { inset: 4px; }
      .welcome-title { padding-top: 24px; font-size: clamp(30px, 8vw, 38px); }
      .art { padding: 24px 34px 0; }
      .art img { width: min(100%, 250px); max-height: 38svh; }
      .copy { padding: 16px 24px 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .sparkle { animation: none; opacity: .4; }
    }
  </style>
</head>
<body>
  <main class="welcome">
    <div class="sparkles" aria-hidden="true">
      <span class="sparkle sparkle-one"></span>
      <span class="sparkle sparkle-two"></span>
      <span class="sparkle sparkle-three"></span>
      <span class="sparkle sparkle-four"></span>
      <span class="sparkle sparkle-five"></span>
      <span class="sparkle sparkle-six"></span>
    </div>
    <h1 class="welcome-title">Wedding Invitation</h1>
    <div class="art">
      <img src="welcome.png" alt="Illustration of a wedding celebration">
    </div>
    <div class="copy">
      <a class="enter" href="index.html?entered=1">Enter Invitation <span aria-hidden="true">&#8594;</span></a>
    </div>
  </main>
</body>
</html>

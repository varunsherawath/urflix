<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Reception | Sushmitha K &amp; Niranjan S</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #faf9f6; color: #292721; font-family: Georgia, serif; text-align: center; }
    main { width: min(100%, 620px); padding: 42px 26px; border: 1px solid #c6aa70; outline: 1px solid #e8ddc6; outline-offset: -10px; background: #fffdf8; }
    img { display: block; width: min(100%, 280px); max-height: 200px; margin: 0 auto 18px; object-fit: contain; }
    .eyebrow { color: #80602f; font: 11px Montserrat, Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(38px, 9vw, 58px); font-weight: 400; }
    .couple { margin: 12px 0 22px; color: #80602f; font-size: clamp(26px, 6vw, 38px); }
    .date { font-size: 24px; }
    .venue { margin: 12px auto 24px; color: #666; line-height: 1.6; }
    a { color: #80602f; font: 11px Montserrat, Arial, sans-serif; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="welcome.png" alt="Wedding celebration illustration">
    <div class="eyebrow">Wedding celebration</div>
    <h1>Reception</h1>
    <div class="couple">Sushmitha K &amp; Niranjan S</div>
    <div class="date">14 &amp; 15 October 2026</div>
    <p class="venue">V.P. Palace<br>Near Madikere Cross, Chinthamani–Srinivasapura Road</p>
    <a href="index.html?entered=1">Return to invitation</a>
  </main>
</body>
</html>
